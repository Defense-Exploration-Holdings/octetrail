name: Build wheels and release assets

# Every pull request, main push, ci/ preview branch push and tag builds the stable-ABI
# (abi3, CPython 3.10+) wheels for Linux (glibc and musl, x86-64 and arm64), macOS
# (x86-64 and arm64) and Windows (x64 and arm64) plus the source distribution, and tests
# each wheel on its own platform. The build job collects them, checks the exact inventory,
# runs the dpkt differential on the Linux x86-64 wheel and writes SHA256SUMS. Only a
# protected initial v* tag push in the canonical repository can reach the release and pypi
# jobs, which publish exactly the checked files.

on:
  pull_request:
  push:
    branches: ['main', 'ci/**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  # A newer push to a ci/ preview branch replaces the older build; nothing else is cancelled.
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/heads/ci/') }}

env:
  PYTHON_KEYRING_BACKEND: keyring.backends.null.Keyring

jobs:
  gate:
    name: Check publication eligibility
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.gate.outputs.publish }}
      version: ${{ steps.gate.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          submodules: false
          lfs: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: python
        with:
          python-version: '3.12'
      - name: Check publication eligibility without credentials
        id: gate
        env:
          RELEASE_REF_PROTECTED: ${{ github.ref_protected }}
          BUILD_PY: ${{ steps.python.outputs.python-path }}
        run: '"$BUILD_PY" -B -I tools/release_ci.py gate'

  check:
    name: Lint and test the sources
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: false
          lfs: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: python
        with:
          python-version: '3.12'
      - name: Install pinned tools
        env:
          BUILD_PY: ${{ steps.python.outputs.python-path }}
        run: |
          rustup toolchain install 1.85.1 --profile minimal --component rustfmt --component clippy
          "$BUILD_PY" -I -m pip --isolated install --index-url https://pypi.org/simple --require-hashes --only-binary=:all: -r tools/lint-linux.txt -r tools/release-linux.txt
      - name: Format, lint and test
        env:
          BUILD_PY: ${{ steps.python.outputs.python-path }}
        run: '"$BUILD_PY" -B -I tools/release_ci.py check'

  wheels:
    name: Wheel ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: linux-x86_64, os: ubuntu-24.04, target: x86_64-unknown-linux-gnu, compatibility: manylinux_2_17, zig: true, test: native, pythons: '3.10 3.14'}
          - {name: linux-aarch64, os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, compatibility: manylinux_2_17, zig: true, test: native, pythons: '3.10 3.14'}
          - {name: musllinux-x86_64, os: ubuntu-24.04, target: x86_64-unknown-linux-musl, compatibility: musllinux_1_2, zig: true, test: alpine, pythons: '3.10 3.14'}
          - {name: musllinux-aarch64, os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, compatibility: musllinux_1_2, zig: true, test: alpine, pythons: '3.10 3.14'}
          - {name: macos-x86_64, os: macos-15-intel, target: x86_64-apple-darwin, deployment: '10.12', test: native, pythons: '3.10 3.14'}
          - {name: macos-arm64, os: macos-15, target: aarch64-apple-darwin, deployment: '11.0', test: native, pythons: '3.10 3.14'}
          - {name: windows-x64, os: windows-2025, target: x86_64-pc-windows-msvc, test: native, pythons: '3.10 3.14'}
          # python.org publishes Windows arm64 builds from 3.11.
          - {name: windows-arm64, os: windows-11-arm, target: aarch64-pc-windows-msvc, test: native, pythons: '3.11 3.14'}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: false
          lfs: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: matrix.test == 'native'
        with:
          python-version: ${{ matrix.pythons == '3.11 3.14' && '3.11' || '3.10' }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: python
        with:
          python-version: '3.14'
      - name: Install the pinned toolchain, target and build tools
        env:
          TARGET: ${{ matrix.target }}
          ZIG: ${{ matrix.zig }}
          BUILD_PY: ${{ steps.python.outputs.python-path }}
        run: |
          rustup toolchain install 1.85.1 --profile minimal --component rustfmt --component clippy --target "$TARGET"
          requirements=(-r tools/build-ci.txt)
          if [ "$ZIG" = true ]; then requirements+=(-r tools/build-zig.txt); fi
          "$BUILD_PY" -I -m pip --isolated install --index-url https://pypi.org/simple --require-hashes --only-binary=:all: "${requirements[@]}"
      - name: Build the wheel
        env:
          TARGET: ${{ matrix.target }}
          COMPATIBILITY: ${{ matrix.compatibility }}
          ZIG: ${{ matrix.zig }}
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.deployment }}
          BUILD_PY: ${{ steps.python.outputs.python-path }}
        run: |
          args=(--target "$TARGET" --out dist)
          if [ -n "$COMPATIBILITY" ]; then args+=(--compatibility "$COMPATIBILITY"); fi
          if [ "$ZIG" = true ]; then args+=(--zig); fi
          if [ -z "$MACOSX_DEPLOYMENT_TARGET" ]; then unset MACOSX_DEPLOYMENT_TARGET; fi
          "$BUILD_PY" -I tools/build_wheels.py "${args[@]}"
          ls dist
          files=(dist/*); test "${#files[@]}" = 1
          "$BUILD_PY" -I tools/check_wheel.py dist/*.whl
      - name: Test the wheel on this platform
        if: matrix.test == 'native'
        env:
          PYTHONS: ${{ matrix.pythons }}
        run: |
          set -euo pipefail
          for version in $PYTHONS; do
            if [ "$RUNNER_OS" = Windows ]; then launcher=(py "-$version"); else launcher=("python$version"); fi
            "${launcher[@]}" -m venv "$RUNNER_TEMP/venv-$version"
            if [ "$RUNNER_OS" = Windows ]; then py="$RUNNER_TEMP/venv-$version/Scripts/python.exe"; else py="$RUNNER_TEMP/venv-$version/bin/python"; fi
            "$py" -I -m pip --isolated install --no-index --no-deps dist/*.whl
            "$py" -I -m pip --isolated check
            (cd "$RUNNER_TEMP" && "$py" -B -I -m unittest discover -s "$GITHUB_WORKSPACE/tests/python")
          done
      - name: Test the wheel in Alpine
        if: matrix.test == 'alpine'
        run: |
          set -euo pipefail
          # Official python images by index digest (multi-arch).
          for image in \
            python:3.10-alpine@sha256:8ca9f9d0f4df2af674092e7e9d79ce7985e783cecfe070f8ea850801b6520bf7 \
            python:3.14-alpine@sha256:5862d971d1f0ae26b258cefa4e893556b1d3aba81bd2ff30888704ad378bab67; do
            docker run --rm --network none -v "$GITHUB_WORKSPACE:/src:ro" "$image" sh -euc '
              python -m venv /tmp/venv
              /tmp/venv/bin/python -I -m pip --isolated install --no-index --no-deps /src/dist/*.whl
              cd /tmp && /tmp/venv/bin/python -B -I -m unittest discover -s /src/tests/python'
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.name }}
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 7
          compression-level: 0


  macos-arm64-missing:
    # GitHub sometimes fails to assign a macOS 15 arm64 runner ("not acquired"),
    # which no timeout setting can extend. This asks the Actions API whether that
    # leg failed without a runner. A failure in one of its steps leaves the
    # fallback off, so the build job stays skipped.
    name: Check whether the macOS arm64 runner was acquired
    needs: wheels
    if: ${{ !cancelled() && needs.wheels.result == 'failure' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      missing: ${{ steps.probe.outputs.missing }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: false
          lfs: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: python
        with:
          python-version: '3.12'
      - name: Check how the macOS arm64 leg failed
        id: probe
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_PY: ${{ steps.python.outputs.python-path }}
        run: '"$BUILD_PY" -B -I tools/release_ci.py fallback'

  wheels-macos-arm64-fallback:
    # The same steps as the wheel matrix, on the macOS 14 arm64 runner.
    name: Wheel ${{ matrix.name }} on the fallback runner
    needs: macos-arm64-missing
    if: ${{ !cancelled() && needs.macos-arm64-missing.outputs.missing == 'true' }}
    strategy:
      matrix:
        include:
          # compatibility and zig are empty, as they are for the macOS rows above.
          - {name: macos-arm64, os: macos-14, target: aarch64-apple-darwin, deployment: '11.0', test: native, pythons: '3.10 3.14', compatibility: '', zig: false}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: false
          lfs: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: matrix.test == 'native'
        with:
          python-version: ${{ matrix.pythons == '3.11 3.14' && '3.11' || '3.10' }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: python
        with:
          python-version: '3.14'
      - name: Install the pinned toolchain, target and build tools
        env:
          TARGET: ${{ matrix.target }}
          ZIG: ${{ matrix.zig }}
          BUILD_PY: ${{ steps.python.outputs.python-path }}
        run: |
          rustup toolchain install 1.85.1 --profile minimal --component rustfmt --component clippy --target "$TARGET"
          requirements=(-r tools/build-ci.txt)
          if [ "$ZIG" = true ]; then requirements+=(-r tools/build-zig.txt); fi
          "$BUILD_PY" -I -m pip --isolated install --index-url https://pypi.org/simple --require-hashes --only-binary=:all: "${requirements[@]}"
      - name: Build the wheel
        env:
          TARGET: ${{ matrix.target }}
          COMPATIBILITY: ${{ matrix.compatibility }}
          ZIG: ${{ matrix.zig }}
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.deployment }}
          BUILD_PY: ${{ steps.python.outputs.python-path }}
        run: |
          args=(--target "$TARGET" --out dist)
          if [ -n "$COMPATIBILITY" ]; then args+=(--compatibility "$COMPATIBILITY"); fi
          if [ "$ZIG" = true ]; then args+=(--zig); fi
          if [ -z "$MACOSX_DEPLOYMENT_TARGET" ]; then unset MACOSX_DEPLOYMENT_TARGET; fi
          "$BUILD_PY" -I tools/build_wheels.py "${args[@]}"
          ls dist
          files=(dist/*); test "${#files[@]}" = 1
          "$BUILD_PY" -I tools/check_wheel.py dist/*.whl
      - name: Test the wheel on this platform
        if: matrix.test == 'native'
        env:
          PYTHONS: ${{ matrix.pythons }}
        run: |
          set -euo pipefail
          for version in $PYTHONS; do
            if [ "$RUNNER_OS" = Windows ]; then launcher=(py "-$version"); else launcher=("python$version"); fi
            "${launcher[@]}" -m venv "$RUNNER_TEMP/venv-$version"
            if [ "$RUNNER_OS" = Windows ]; then py="$RUNNER_TEMP/venv-$version/Scripts/python.exe"; else py="$RUNNER_TEMP/venv-$version/bin/python"; fi
            "$py" -I -m pip --isolated install --no-index --no-deps dist/*.whl
            "$py" -I -m pip --isolated check
            (cd "$RUNNER_TEMP" && "$py" -B -I -m unittest discover -s "$GITHUB_WORKSPACE/tests/python")
          done
      - name: Test the wheel in Alpine
        if: matrix.test == 'alpine'
        run: |
          set -euo pipefail
          # Official python images by index digest (multi-arch).
          for image in \
            python:3.10-alpine@sha256:8ca9f9d0f4df2af674092e7e9d79ce7985e783cecfe070f8ea850801b6520bf7 \
            python:3.14-alpine@sha256:5862d971d1f0ae26b258cefa4e893556b1d3aba81bd2ff30888704ad378bab67; do
            docker run --rm --network none -v "$GITHUB_WORKSPACE:/src:ro" "$image" sh -euc '
              python -m venv /tmp/venv
              /tmp/venv/bin/python -I -m pip --isolated install --no-index --no-deps /src/dist/*.whl
              cd /tmp && /tmp/venv/bin/python -B -I -m unittest discover -s /src/tests/python'
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.name }}
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  sdist:
    name: Source distribution
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: false
          lfs: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: python
        with:
          python-version: '3.14'
      - name: Build the sdist and a wheel from it
        env:
          BUILD_PY: ${{ steps.python.outputs.python-path }}
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.1 --profile minimal --component rustfmt --component clippy
          "$BUILD_PY" -I -m pip --isolated install --index-url https://pypi.org/simple --require-hashes --only-binary=:all: -r tools/build-ci.txt
          "$BUILD_PY" -I -m maturin sdist --out dist
          ls dist
          files=(dist/*); test "${#files[@]}" = 1
          # Build from the unpacked sdist alone, as pip would for a platform without a wheel.
          mkdir "$RUNNER_TEMP/unpacked"
          tar -xzf dist/*.tar.gz -C "$RUNNER_TEMP/unpacked"
          (cd "$RUNNER_TEMP"/unpacked/octetrail-* && "$BUILD_PY" -I -m maturin build --release --locked --out "$RUNNER_TEMP/from-sdist")
          "$BUILD_PY" -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -I -m pip --isolated install --no-index --no-deps "$RUNNER_TEMP"/from-sdist/*.whl
          (cd "$RUNNER_TEMP" && "$RUNNER_TEMP/venv/bin/python" -B -I -m unittest discover -s "$GITHUB_WORKSPACE/tests/python")
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-sdist
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  build:
    name: Collect and verify the release files
    needs: [gate, check, wheels, wheels-macos-arm64-fallback, sdist]
    # Runs when every wheel leg passed, or when the fallback rebuilt the macOS
    # arm64 wheel. The inventory check then still demands all eight wheels and
    # the sdist, so a missing wheel from any other leg fails here.
    if: >-
      !cancelled() &&
      needs.gate.result == 'success' &&
      needs.check.result == 'success' &&
      needs.sdist.result == 'success' &&
      (needs.wheels.result == 'success' || needs.wheels-macos-arm64-fallback.result == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    outputs:
      publish: ${{ needs.gate.outputs.publish }}
      version: ${{ needs.gate.outputs.version }}
      manifest: ${{ steps.verify.outputs.manifest }}
      artifact-id: ${{ steps.artifact.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: false
          lfs: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: py310
        with:
          python-version: '3.10'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: py314
        with:
          python-version: '3.14'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: python
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          merge-multiple: true
          path: release/dist
      - name: Install pinned release tools
        env:
          BUILD_PY: ${{ steps.python.outputs.python-path }}
        run: '"$BUILD_PY" -I -m pip --isolated install --index-url https://pypi.org/simple --require-hashes --only-binary=:all: -r tools/release-linux.txt'
      - name: Verify the inventory, metadata and dpkt behavior, and write SHA256SUMS
        id: verify
        env:
          BUILD_PY: ${{ steps.python.outputs.python-path }}
          PY310: ${{ steps.py310.outputs.python-path }}
          PY314: ${{ steps.py314.outputs.python-path }}
        run: '"$BUILD_PY" -B -I tools/release_ci.py verify --dist release/dist --manifest release/SHA256SUMS --interpreter "$PY310" --interpreter "$PY314"'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: artifact
        with:
          name: release-files-${{ github.sha }}
          path: |
            release/dist/
            release/SHA256SUMS
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  release:
    name: Publish verified GitHub Release assets
    needs: build
    if: >-
      !cancelled() &&
      github.event_name == 'push' &&
      github.repository == 'Defense-Exploration-Holdings/octetrail' &&
      github.event.repository.id == 1457516742 &&
      github.event.repository.private == false &&
      github.event.repository.default_branch == 'main' &&
      github.ref_type == 'tag' &&
      github.ref_protected == true &&
      github.event.created == true &&
      github.event.deleted == false &&
      github.event.forced == false &&
      vars.WHEEL_RELEASES_ENABLED == 'true' &&
      needs.build.result == 'success' &&
      needs.build.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: github-release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: release
      # No checkout, package installation or source execution in this job.
      - name: Verify the exact tested files against SHA256SUMS
        env:
          VERSION: ${{ needs.build.outputs.version }}
          MANIFEST_SHA256: ${{ needs.build.outputs.manifest }}
        run: |
          python3 -I - <<'PY'
          import hashlib
          import os
          import re
          from pathlib import Path

          version, manifest_digest = os.environ["VERSION"], os.environ["MANIFEST_SHA256"]
          if not re.fullmatch(r"(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)", version):
              raise SystemExit("version_format")
          if not re.fullmatch(r"[0-9a-f]{64}", manifest_digest):
              raise SystemExit("manifest_digest")
          platforms = ("manylinux2014_x86_64.manylinux_2_17_x86_64", "manylinux2014_aarch64.manylinux_2_17_aarch64", "musllinux_1_2_x86_64", "musllinux_1_2_aarch64", "macosx_10_12_x86_64", "macosx_11_0_arm64", "win_amd64", "win_arm64")
          names = {f"octetrail-{version}-cp310-abi3-{p}.whl" for p in platforms} | {f"octetrail-{version}.tar.gz"}
          root, dist = Path("release"), Path("release/dist")
          manifest = root / "SHA256SUMS"
          if {p.name for p in root.iterdir()} != {"SHA256SUMS", "dist"} or not dist.is_dir() or dist.is_symlink():
              raise SystemExit("artifact_layout")
          if not manifest.is_file() or manifest.is_symlink() or hashlib.sha256(manifest.read_bytes()).hexdigest() != manifest_digest:
              raise SystemExit("manifest_hash_mismatch")
          entries = dict(reversed(line.split("  ", 1)) for line in manifest.read_text().splitlines())
          if set(entries) != names or {p.name for p in dist.iterdir()} != names:
              raise SystemExit("dist_inventory")
          for name, digest in entries.items():
              path = dist / name
              if not path.is_file() or path.is_symlink() or not re.fullmatch(r"[0-9a-f]{64}", digest):
                  raise SystemExit("dist_type_or_digest")
              if hashlib.sha256(path.read_bytes()).hexdigest() != digest:
                  raise SystemExit("dist_hash_mismatch")
          print(f"{len(entries)} tested release files verified")
          PY
      - name: Create or resume this run's draft, verify assets, then publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_HOST: github.com
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_ID: ${{ github.event.repository.id }}
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          ARTIFACT_ID: ${{ needs.build.outputs.artifact-id }}
          RELEASE_TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
          MANIFEST_SHA256: ${{ needs.build.outputs.manifest }}
        run: |
          python3 -I - <<'PY'
          import hashlib
          import json
          import os
          import re
          import subprocess
          import time
          from pathlib import Path

          def require(condition, code):
              if not condition:
                  raise SystemExit(code)

          repo = os.environ["REPOSITORY"]
          version, tag, sha = (os.environ[name] for name in ("VERSION", "RELEASE_TAG", "SOURCE_SHA"))
          require(repo == "Defense-Exploration-Holdings/octetrail" and os.environ["REPOSITORY_ID"] == "1457516742", "repository_identity")
          require(re.fullmatch(r"(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)", version) and tag == "v" + version, "release_tag_version")
          require(re.fullmatch(r"[0-9a-f]{40}", sha), "release_source")
          run_id, artifact_id = (os.environ[name] for name in ("RUN_ID", "ARTIFACT_ID"))
          require(re.fullmatch(r"[1-9][0-9]*", run_id) and re.fullmatch(r"[1-9][0-9]*", artifact_id), "release_run_identity")
          manifest_digest = os.environ["MANIFEST_SHA256"]
          require(re.fullmatch(r"[0-9a-f]{64}", manifest_digest), "manifest_digest")
          platforms = ("manylinux2014_x86_64.manylinux_2_17_x86_64", "manylinux2014_aarch64.manylinux_2_17_aarch64", "musllinux_1_2_x86_64", "musllinux_1_2_aarch64", "macosx_10_12_x86_64", "macosx_11_0_arm64", "win_amd64", "win_arm64")
          names = {f"octetrail-{version}-cp310-abi3-{p}.whl" for p in platforms} | {f"octetrail-{version}.tar.gz"}
          root, dist = Path("release"), Path("release/dist")
          manifest = root / "SHA256SUMS"
          require({p.name for p in root.iterdir()} == {"SHA256SUMS", "dist"} and dist.is_dir() and not dist.is_symlink(), "artifact_layout")
          require(manifest.is_file() and not manifest.is_symlink() and hashlib.sha256(manifest.read_bytes()).hexdigest() == manifest_digest, "manifest_hash_mismatch")
          entries = dict(reversed(line.split("  ", 1)) for line in manifest.read_text().splitlines())
          require(set(entries) == names and {p.name for p in dist.iterdir()} == names, "dist_inventory")
          files = {"SHA256SUMS": manifest}
          expected = {"SHA256SUMS": (manifest.stat().st_size, "sha256:" + manifest_digest)}
          for name, digest in entries.items():
              path = dist / name
              require(path.is_file() and not path.is_symlink() and re.fullmatch(r"[0-9a-f]{64}", digest), "dist_type_or_digest")
              require(hashlib.sha256(path.read_bytes()).hexdigest() == digest, "dist_hash_mismatch")
              files[name] = path
              expected[name] = (path.stat().st_size, "sha256:" + digest)
          marker = {"format": 2, "repository": repo, "source": sha, "version": version, "run_id": run_id, "artifact_id": artifact_id, "manifest": manifest_digest}
          body = "Stable-ABI wheels for CPython 3.10 and later on Linux (glibc 2.17+ and musl 1.2+, x86-64 and arm64), macOS (x86-64 10.12+ and arm64 11.0+) and Windows (x64 and arm64), and the source distribution. SHA256SUMS lists every file.\nSource commit: " + sha
          body += "\n\n<!-- octetrail-wheel-release:" + json.dumps(marker, sort_keys=True, separators=(",", ":")) + " -->"

          def api(endpoint, *, method="GET", body=None, paginate=False, upload=None):
              command = ["gh", "api", "--hostname", "github.com", "--method", method, endpoint]
              if paginate:
                  command += ["--paginate", "--slurp"]
              if body is not None:
                  command += ["--input", "-"]
              if upload is not None:
                  command += ["--header", "Content-Type: application/octet-stream", "--input", str(upload)]
              result = subprocess.run(command, input=json.dumps(body) if body is not None else None, text=True, capture_output=True, check=True, timeout=300)
              return json.loads(result.stdout)

          def matching_releases():
              pages = api(f"repos/{repo}/releases?per_page=100", paginate=True)
              require(type(pages) is list and all(type(page) is list for page in pages), "release_listing")
              return [item for page in pages for item in page if item.get("tag_name") == tag]

          # Listing includes drafts. Only this exact run/artifact's own draft may resume.
          matches = matching_releases()
          require(len(matches) <= 1, "release_creation_race")
          def owned_draft(release):
              require(type(release.get("id")) is int and release["id"] > 0 and release.get("tag_name") == tag and release.get("draft") is True and release.get("prerelease") is False and release.get("body") == body and release.get("author", {}).get("login") == "github-actions[bot]", "foreign_or_published_release")
          if matches:
              owned_draft(matches[0])
          ref = api(f"repos/{repo}/git/ref/tags/{tag}")
          obj = ref["object"]
          for _ in range(8):
              if obj["type"] == "commit":
                  break
              require(obj["type"] == "tag" and re.fullmatch(r"[0-9a-f]{40}", obj["sha"]), "tag_object")
              obj = api(f"repos/{repo}/git/tags/{obj['sha']}")["object"]
          require(obj["type"] == "commit" and obj["sha"] == sha, "remote_tag_mismatch")
          comparison = api(f"repos/{repo}/compare/{sha}...main")
          require(comparison.get("status") in ("ahead", "identical") and comparison.get("merge_base_commit", {}).get("sha") == sha, "remote_main_ancestry")

          if matches:
              created = matches[0]
          else:
              created = api(f"repos/{repo}/releases", method="POST", body={"tag_name": tag, "target_commitish": sha, "name": "OctetRail " + version, "body": body, "draft": True, "prerelease": False})
              require(created.get("assets") == [], "new_draft_assets")
          owned_draft(created)
          release_id = created["id"]
          # The listing can lag a just-created draft; wait for it, but never accept a second release.
          for attempt in range(12):
              matches = matching_releases()
              require(len(matches) <= 1 and all(m.get("id") == release_id for m in matches), "release_creation_race")
              if matches:
                  break
              time.sleep(5)
          require(len(matches) == 1, "release_listing_lag")
          def verified_assets(complete=False):
              pages = api(f"repos/{repo}/releases/{release_id}/assets?per_page=100", paginate=True)
              assets = [asset for page in pages for asset in page]
              names = [asset.get("name") for asset in assets]
              require(len(names) == len(set(names)) and set(names) <= set(expected), "uploaded_inventory")
              if complete:
                  require(set(names) == set(expected), "uploaded_inventory")
              for asset in assets:
                  require(asset.get("state") == "uploaded" and (asset.get("size"), asset.get("digest")) == expected[asset["name"]], "uploaded_hash_or_size")
              return set(names)
          owned_draft(api(f"repos/{repo}/releases/{release_id}"))
          present = verified_assets()
          for name in sorted(expected.keys() - present):
              # No clobber, delete or replacement: upload only absent assets.
              api(f"https://uploads.github.com/repos/{repo}/releases/{release_id}/assets?name={name}", method="POST", upload=files[name])
          verified_assets(complete=True)
          current = api(f"repos/{repo}/releases/{release_id}")
          owned_draft(current)
          published = api(f"repos/{repo}/releases/{release_id}", method="PATCH", body={"draft": False, "prerelease": False, "make_latest": "true"})
          require(published.get("id") == release_id and published.get("tag_name") == tag and published.get("draft") is False and published.get("prerelease") is False, "publication_response")
          print(f"GitHub Release published with {len(expected)} verified assets")
          PY

  pypi:
    name: Publish tested files to PyPI
    needs: build
    if: >-
      !cancelled() &&
      github.event_name == 'push' &&
      github.repository == 'Defense-Exploration-Holdings/octetrail' &&
      github.event.repository.id == 1457516742 &&
      github.event.repository.private == false &&
      github.event.repository.default_branch == 'main' &&
      github.ref_type == 'tag' &&
      github.ref_protected == true &&
      github.event.created == true &&
      github.event.deleted == false &&
      github.event.forced == false &&
      github.run_attempt == 1 &&
      vars.PYPI_PUBLISHING_ENABLED == 'true' &&
      needs.build.result == 'success' &&
      needs.build.outputs.publish == 'true' &&
      needs.build.outputs.artifact-id != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/p/octetrail
    permissions:
      id-token: write
    steps:
      - name: Validate tested build outputs before artifact download
        env:
          VERSION: ${{ needs.build.outputs.version }}
          RELEASE_TAG: ${{ github.ref_name }}
          ARTIFACT_ID: ${{ needs.build.outputs.artifact-id }}
          MANIFEST_SHA256: ${{ needs.build.outputs.manifest }}
        run: |
          python3 -I - <<'PY'
          import os
          import re

          version = os.environ["VERSION"]
          if not re.fullmatch(r"(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)", version):
              raise SystemExit("version_format")
          if os.environ["RELEASE_TAG"] != "v" + version:
              raise SystemExit("release_tag_version")
          if not re.fullmatch(r"[1-9][0-9]*", os.environ["ARTIFACT_ID"]):
              raise SystemExit("artifact_id")
          if not re.fullmatch(r"[0-9a-f]{64}", os.environ["MANIFEST_SHA256"]):
              raise SystemExit("manifest_digest")
          print("tested build outputs verified")
          PY
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: release
      - name: Verify the exact tested files against SHA256SUMS
        env:
          VERSION: ${{ needs.build.outputs.version }}
          MANIFEST_SHA256: ${{ needs.build.outputs.manifest }}
        run: |
          python3 -I - <<'PY'
          import hashlib
          import os
          import re
          from pathlib import Path

          version, manifest_digest = os.environ["VERSION"], os.environ["MANIFEST_SHA256"]
          if not re.fullmatch(r"(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)", version):
              raise SystemExit("version_format")
          if not re.fullmatch(r"[0-9a-f]{64}", manifest_digest):
              raise SystemExit("manifest_digest")
          platforms = ("manylinux2014_x86_64.manylinux_2_17_x86_64", "manylinux2014_aarch64.manylinux_2_17_aarch64", "musllinux_1_2_x86_64", "musllinux_1_2_aarch64", "macosx_10_12_x86_64", "macosx_11_0_arm64", "win_amd64", "win_arm64")
          names = {f"octetrail-{version}-cp310-abi3-{p}.whl" for p in platforms} | {f"octetrail-{version}.tar.gz"}
          root, dist = Path("release"), Path("release/dist")
          manifest = root / "SHA256SUMS"
          if not root.is_dir() or {p.name for p in root.iterdir()} != {"SHA256SUMS", "dist"} or not dist.is_dir() or dist.is_symlink():
              raise SystemExit("artifact_layout")
          if not manifest.is_file() or manifest.is_symlink() or hashlib.sha256(manifest.read_bytes()).hexdigest() != manifest_digest:
              raise SystemExit("manifest_hash_mismatch")
          entries = dict(reversed(line.split("  ", 1)) for line in manifest.read_text().splitlines())
          if set(entries) != names or {p.name for p in dist.iterdir()} != names:
              raise SystemExit("dist_inventory")
          for name, digest in entries.items():
              path = dist / name
              if not path.is_file() or path.is_symlink() or not re.fullmatch(r"[0-9a-f]{64}", digest):
                  raise SystemExit("dist_type_or_digest")
              if hashlib.sha256(path.read_bytes()).hexdigest() != digest:
                  raise SystemExit("dist_hash_mismatch")
          print(f"{len(entries)} tested release files verified")
          PY
      - name: Publish only the tested files through Trusted Publishing
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: release/dist/
          skip-existing: false
          verify-metadata: true
          attestations: true
          verbose: false
