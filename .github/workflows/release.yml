name: Build wheels and release assets

on:
  pull_request:
  push:
    branches: ['main']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify Linux wheels
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
        working-directory: .
    outputs:
      publish: ${{ steps.gate.outputs.publish }}
      version: ${{ steps.gate.outputs.version }}
      cp312: ${{ steps.verify.outputs.cp312 }}
      cp313: ${{ steps.verify.outputs.cp313 }}
      artifact-id: ${{ steps.artifact.outputs.artifact-id }}
    env:
      PYTHON_KEYRING_BACKEND: keyring.backends.null.Keyring
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          submodules: false
          lfs: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: cp312
        with:
          python-version: '3.12'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: cp313
        with:
          python-version: '3.13'
      - name: Check publication eligibility without credentials
        id: gate
        env:
          RELEASE_REF_PROTECTED: ${{ github.ref_protected }}
          BUILD_PY: ${{ steps.cp312.outputs.python-path }}
        run: '"$BUILD_PY" -B -I tools/release_ci.py gate'
      - name: Install pinned build and validation tools
        env:
          BUILD_PY: ${{ steps.cp312.outputs.python-path }}
        run: |
          rustup toolchain install 1.85.1 --profile minimal --component rustfmt --component clippy
          "$BUILD_PY" -I -m pip --isolated install --index-url https://pypi.org/simple --require-hashes --only-binary=:all: -r tools/build-linux.txt -r tools/lint-linux.txt -r tools/release-linux.txt
      - name: Build and test the exact release files
        id: verify
        env:
          BUILD_PY: ${{ steps.cp312.outputs.python-path }}
          SECOND_PY: ${{ steps.cp313.outputs.python-path }}
        run: '"$BUILD_PY" -B -I tools/release_ci.py build --interpreter "$BUILD_PY" --interpreter "$SECOND_PY"'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: artifact
        with:
          name: release-wheels-${{ github.sha }}
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  release:
    name: Publish verified GitHub Release assets
    needs: build
    if: >-
      github.event_name == 'push' &&
      github.repository == 'Defense-Exploration-Holdings/octetrail' &&
      github.event.repository.id == 1457516742 &&
      github.event.repository.private == false &&
      github.event.repository.default_branch == 'main' &&
      github.ref_type == 'tag' &&
      github.ref_protected == true &&
      github.event.created == true &&
      github.event.deleted == false &&
      github.event.forced == false &&
      vars.WHEEL_RELEASES_ENABLED == 'true' &&
      needs.build.result == 'success' &&
      needs.build.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: dist
      # No checkout, package installation or source execution in this job.
      - name: Verify the exact tested wheel hashes and inventory
        env:
          VERSION: ${{ needs.build.outputs.version }}
          CP312_SHA256: ${{ needs.build.outputs.cp312 }}
          CP313_SHA256: ${{ needs.build.outputs.cp313 }}
        run: |
          python3 -I - <<'PY'
          import hashlib
          import os
          import re
          from pathlib import Path

          version = os.environ["VERSION"]
          if not re.fullmatch(r"(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)", version):
              raise SystemExit("version_format")
          expected = {
              f"octetrail-{version}-{cp}-{cp}-manylinux_2_34_x86_64.whl": os.environ[f"{cp.upper()}_SHA256"]
              for cp in ("cp312", "cp313")
          }
          dist = Path("dist")
          if {p.name for p in dist.iterdir()} != set(expected):
              raise SystemExit("wheel_inventory")
          for name, digest in expected.items():
              path = dist / name
              if not path.is_file() or path.is_symlink() or not re.fullmatch(r"[0-9a-f]{64}", digest):
                  raise SystemExit("wheel_type_or_digest")
              if hashlib.sha256(path.read_bytes()).hexdigest() != digest:
                  raise SystemExit("wheel_hash_mismatch")
          print("two tested wheel hashes verified")
          PY
      - name: Create or resume this run's draft, verify assets, then publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_HOST: github.com
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_ID: ${{ github.event.repository.id }}
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          ARTIFACT_ID: ${{ needs.build.outputs.artifact-id }}
          RELEASE_TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
          CP312_SHA256: ${{ needs.build.outputs.cp312 }}
          CP313_SHA256: ${{ needs.build.outputs.cp313 }}
        run: |
          python3 -I - <<'PY'
          import hashlib
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          def require(condition, code):
              if not condition:
                  raise SystemExit(code)

          repo = os.environ["REPOSITORY"]
          version, tag, sha = (os.environ[name] for name in ("VERSION", "RELEASE_TAG", "SOURCE_SHA"))
          require(repo == "Defense-Exploration-Holdings/octetrail" and os.environ["REPOSITORY_ID"] == "1457516742", "repository_identity")
          require(re.fullmatch(r"(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)", version) and tag == "v" + version, "release_tag_version")
          require(re.fullmatch(r"[0-9a-f]{40}", sha), "release_source")
          run_id, artifact_id = (os.environ[name] for name in ("RUN_ID", "ARTIFACT_ID"))
          require(re.fullmatch(r"[1-9][0-9]*", run_id) and re.fullmatch(r"[1-9][0-9]*", artifact_id), "release_run_identity")
          expected = {}
          for cp in ("cp312", "cp313"):
              name = f"octetrail-{version}-{cp}-{cp}-manylinux_2_34_x86_64.whl"
              digest = os.environ[f"{cp.upper()}_SHA256"]
              path = Path("dist") / name
              require(path.is_file() and not path.is_symlink() and re.fullmatch(r"[0-9a-f]{64}", digest), "wheel_type_or_digest")
              require(hashlib.sha256(path.read_bytes()).hexdigest() == digest, "wheel_hash_mismatch")
              expected[name] = (path.stat().st_size, "sha256:" + digest)
          require({p.name for p in Path("dist").iterdir()} == set(expected), "wheel_inventory")
          marker = {"format": 1, "repository": repo, "source": sha, "version": version, "run_id": run_id, "artifact_id": artifact_id, "wheels": expected}
          body = "Linux x86-64 CPython 3.12 and 3.13 wheels (glibc 2.34+).\nSource commit: " + sha
          body += "\n\n<!-- octetrail-wheel-release:" + json.dumps(marker, sort_keys=True, separators=(",", ":")) + " -->"

          def api(endpoint, *, method="GET", body=None, paginate=False, upload=None):
              command = ["gh", "api", "--hostname", "github.com", "--method", method, endpoint]
              if paginate:
                  command += ["--paginate", "--slurp"]
              if body is not None:
                  command += ["--input", "-"]
              if upload is not None:
                  command += ["--header", "Content-Type: application/octet-stream", "--input", str(upload)]
              result = subprocess.run(command, input=json.dumps(body) if body is not None else None, text=True, capture_output=True, check=True, timeout=120)
              return json.loads(result.stdout)

          def matching_releases():
              pages = api(f"repos/{repo}/releases?per_page=100", paginate=True)
              require(type(pages) is list and all(type(page) is list for page in pages), "release_listing")
              return [item for page in pages for item in page if item.get("tag_name") == tag]

          # Listing includes drafts. Only this exact run/artifact's own draft may resume.
          matches = matching_releases()
          require(len(matches) <= 1, "release_creation_race")
          def owned_draft(release):
              require(type(release.get("id")) is int and release["id"] > 0 and release.get("tag_name") == tag and release.get("draft") is True and release.get("prerelease") is False and release.get("body") == body and release.get("author", {}).get("login") == "github-actions[bot]", "foreign_or_published_release")
          if matches:
              owned_draft(matches[0])
          ref = api(f"repos/{repo}/git/ref/tags/{tag}")
          obj = ref["object"]
          for _ in range(8):
              if obj["type"] == "commit":
                  break
              require(obj["type"] == "tag" and re.fullmatch(r"[0-9a-f]{40}", obj["sha"]), "tag_object")
              obj = api(f"repos/{repo}/git/tags/{obj['sha']}")["object"]
          require(obj["type"] == "commit" and obj["sha"] == sha, "remote_tag_mismatch")
          comparison = api(f"repos/{repo}/compare/{sha}...main")
          require(comparison.get("status") in ("ahead", "identical") and comparison.get("merge_base_commit", {}).get("sha") == sha, "remote_main_ancestry")

          if matches:
              created = matches[0]
          else:
              created = api(f"repos/{repo}/releases", method="POST", body={"tag_name": tag, "target_commitish": sha, "name": "OctetRail " + version, "body": body, "draft": True, "prerelease": False})
              require(created.get("assets") == [], "new_draft_assets")
          owned_draft(created)
          release_id = created["id"]
          matches = matching_releases()
          require(len(matches) == 1 and matches[0].get("id") == release_id, "release_creation_race")
          def verified_assets(complete=False):
              pages = api(f"repos/{repo}/releases/{release_id}/assets?per_page=100", paginate=True)
              assets = [asset for page in pages for asset in page]
              names = [asset.get("name") for asset in assets]
              require(len(names) == len(set(names)) and set(names) <= set(expected), "uploaded_inventory")
              if complete:
                  require(set(names) == set(expected), "uploaded_inventory")
              for asset in assets:
                  require(asset.get("state") == "uploaded" and (asset.get("size"), asset.get("digest")) == expected[asset["name"]], "uploaded_hash_or_size")
              return set(names)
          owned_draft(api(f"repos/{repo}/releases/{release_id}"))
          present = verified_assets()
          for name in expected.keys() - present:
              # No clobber, delete or replacement: upload only absent assets.
              api(f"https://uploads.github.com/repos/{repo}/releases/{release_id}/assets?name={name}", method="POST", upload=Path("dist") / name)
          verified_assets(complete=True)
          current = api(f"repos/{repo}/releases/{release_id}")
          owned_draft(current)
          published = api(f"repos/{repo}/releases/{release_id}", method="PATCH", body={"draft": False, "prerelease": False, "make_latest": "true"})
          require(published.get("id") == release_id and published.get("tag_name") == tag and published.get("draft") is False and published.get("prerelease") is False, "publication_response")
          print("GitHub Release published with the two verified wheels")
          PY
