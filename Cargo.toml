[package]
name = "octetrail"
version = "1.0.0"
edition = "2021"
rust-version = "1.85"
description = "Fast packet parsing and pcap I/O for Python, written in Rust"
license = "BSD-3-Clause"
publish = false

[features]
# Protocol parsers used by the Python bindings. Not a stable API.
protocols = []

[workspace]
members = ["bindings/python"]
exclude = ["fuzz"]
default-members = ["."]
resolver = "2"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
