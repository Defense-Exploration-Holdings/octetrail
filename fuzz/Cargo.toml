[package]
name = "octetrail-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
octetrail = { path = ".." }

# Kept out of the main workspace so ordinary builds and wheels never need nightly.
[workspace]

[[bin]]
name = "pcap_reader"
path = "fuzz_targets/pcap_reader.rs"
test = false
doc = false
bench = false

[[bin]]
name = "pcapng_reader"
path = "fuzz_targets/pcapng_reader.rs"
test = false
doc = false
bench = false

[[bin]]
name = "packet"
path = "fuzz_targets/packet.rs"
test = false
doc = false
bench = false

[[bin]]
name = "dhcp"
path = "fuzz_targets/dhcp.rs"
test = false
doc = false
bench = false

[[bin]]
name = "dns"
path = "fuzz_targets/dns.rs"
test = false
doc = false
bench = false

[[bin]]
name = "http"
path = "fuzz_targets/http.rs"
test = false
doc = false
bench = false

[[bin]]
name = "tls"
path = "fuzz_targets/tls.rs"
test = false
doc = false
bench = false
